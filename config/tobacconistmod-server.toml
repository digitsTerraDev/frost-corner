	#Use color 'auto' to derive the hue from the blend's stored varieties/cures/flavors.
	#Values are 0.0-1.0. Suggested bold-but-still-readable ranges: tint 0.45-0.70, brightness 0.04-0.12, saturation 0.05-0.15.
