[gameplay]
	#Enable the tobacco quality system: quality scores/tiers and quality-based smoking bonuses.
	#When false, quality is hidden and ignored for gameplay, but existing quality data is preserved so it can be turned back on later.
	enableQualitySystem = true
	#Apply Tobacconist's nicotine status effect when tobacco is smoked.
	#Disabling this does not disable configured additional smoking effects.
	enableNicotineEffects = true
	#Raw tobacco-quality points removed when a Cigarette or Cigar is made by generic crafting automation while Create is installed.
	#Hand crafting and Tobacconist's dedicated Create Deployer -> Incomplete Product -> Mechanical Press route keep full quality.
	#The quality system uses an underlying 0-120 scale; the default penalty of 10 is usually about one displayed Product Quality level.
	#Set to 0 to disable this automation penalty.
	# Default: 10
	# Range: 0 ~ 50
	genericAutomationQualityPenalty = 10

[blending]
	#Hidden named tobacco blends with exact per-variety requirements.
	#Format: Display Name=variety|minQuality|cure|flavor+variety|minQuality|cure|flavor[+...]
	#Quality is a minimum (0-120). Cure: air, fire, sun, flue, or * for any.
	#Flavor: none, *, or a flavor id such as apple, chorus_fruit, coffee, vanilla, or mint.
	#Order does not matter. Legacy fonted and variety-only entries remain accepted for migration.
	#Valid varieties: wild, virginia, burley, oriental, dokha, shade.
	#The bundled compatibility secrets use generic flavor tags; they become craftable when matching ingredients exist.
	#Servers can rename, remove, or add entries for their own roleplay/lore.
	secretBlends = ["The Ninth Bell=virginia|95|flue|none+burley|95|fire|none+shade|90|air|none", "Bosphorus No. 7=oriental|100|sun|none+dokha|95|fire|none+virginia|90|flue|none", "Black Cabinet=burley|100|fire|none+dokha|100|fire|none+wild|95|air|none", "Three Crowns=virginia|100|flue|none+oriental|100|sun|none+shade|100|air|none", "Last Harvest=wild|110|sun|none+virginia|105|flue|none+burley|105|air|none", "Golden Sultana=oriental|100|sun|honey+virginia|95|flue|none+shade|95|air|none", "Orchard Reserve=virginia|100|flue|apple+burley|95|air|none+shade|90|air|honey", "Crown & Ember=virginia|105|flue|goldenapple+burley|100|fire|none+oriental|95|sun|none", "Lamplighter No. 23=burley|95|fire|cocoa+virginia|95|flue|none+shade|90|air|none", "Far End Mixture=dokha|100|fire|chorus_fruit+oriental|95|sun|none+wild|95|air|glowberry", "Vienna Cabinet=burley|100|air|coffee+virginia|95|flue|vanilla+oriental|90|sun|none", "Red Parlor=virginia|100|flue|cherry+burley|95|air|none+shade|95|air|vanilla", "Mint Condition=dokha|100|fire|mint+oriental|95|sun|lime+virginia|90|flue|none", "The Confectioner=burley|100|air|caramel+virginia|95|flue|vanilla+shade|95|air|custard", "Black Orchard=burley|100|fire|blackberry+virginia|95|flue|none+oriental|95|sun|cinnamon", "Silk Road No. 12=oriental|105|sun|tea+dokha|100|fire|none+shade|95|air|hibiscus", "Blue Hour=shade|100|air|lavender+virginia|95|flue|none+oriental|95|sun|tea", "Port Royal=virginia|100|flue|coconut+burley|95|air|caramel+oriental|95|sun|none", "Summer Ledger=virginia|100|flue|strawberry+shade|95|air|raspberry+oriental|90|sun|none", "The Decadent=burley|105|fire|brownie+virginia|100|flue|custard+shade|100|air|vanilla"]
