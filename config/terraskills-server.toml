[generation]
	#Points generated per configured real-time skill day before nutrition and stats.
	# Default: 1.0
	# Range: 0.0 ~ 10000.0
	baseSkillPointsPerDay = 1.0
	#Number of real-world minutes in one skill day. 1440 is a real 24-hour day; lower values are useful for testing.
	# Default: 1440.0
	# Range: 0.0167 ~ 525600.0
	realMinutesPerSkillDay = 1440.0
	#Master startup switch for passive generation. Admins can also pause/resume the live server with commands.
	enabled = true
	#If true, calendar time while logged out is awarded on login using the player's current nutrition.
	accrueWhileOffline = false

[nutrition]
	#Points per day contributed when this nutrient is 100% full.
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	grainPointsPerDayAtFull = 0.2
	#Points per day contributed when this nutrient is 100% full.
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	fruitPointsPerDayAtFull = 0.2
	#Points per day contributed when this nutrient is 100% full.
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	vegetablePointsPerDayAtFull = 0.2
	#Points per day contributed when this nutrient is 100% full.
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	proteinPointsPerDayAtFull = 0.2
	#Points per day contributed when this nutrient is 100% full.
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	dairyPointsPerDayAtFull = 0.2
	#Curve applied to each normalized nutrient. Above 1 rewards high fullness more strongly; below 1 is more forgiving.
	# Default: 1.0
	# Range: 0.05 ~ 10.0
	fullnessExponent = 1.0
	#Lowest possible nutrition balance multiplier. Perfect balance always scales to 1.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	minimumBalanceMultiplier = 0.25
	#Curve applied to the average closeness of every pair of nutrients when calculating balance.
	# Default: 1.0
	# Range: 0.05 ~ 10.0
	balanceExponent = 1.0

[rpgStats]
	#Additive generation multiplier per point in a tree's primary stat. 0.05 means +5%.
	# Default: 0.05
	# Range: 0.0 ~ 100.0
	primaryBonusPerPoint = 0.05
	#Additive generation multiplier per point in a tree's secondary stat.
	# Default: 0.025
	# Range: 0.0 ~ 100.0
	secondaryBonusPerPoint = 0.025
	#Hard cap on the combined primary/secondary stat multiplier.
	# Default: 10.0
	# Range: 1.0 ~ 10000.0
	maximumMultiplier = 10.0
	#Maximum value accepted for any RPG stat.
	# Default: 100
	# Range: 0 ~ 1000000
	maximumStatValue = 100

[skillTrees]
	#Available Pufferfish skill trees and their preferred stats.
	#Format: category_id,primary_stat,secondary_stat
	#Stats: might, finesse, endurance, intelligence, instinct
	trees = ["terraskills:warrior,might,endurance", "terraskills:scholar,intelligence,instinct", "terraskills:miner,endurance,instinct"]
