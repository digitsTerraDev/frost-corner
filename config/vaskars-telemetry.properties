# Anonymous usage statistics for Vaskars Remains, Opus and Bestiary.
# Sent every ten minutes and when the game closes: a random install id, mod and Minecraft
# versions, which of the mods are installed together, minutes played, a few settings and
# counters of what happened, how many minutes are spent in the menu, paused or away, and once per
# start the ids of the other installed mods (no versions, no file names).
# No IP address is kept, no player name, no player id, no world name.
# Set to false to send nothing.
enabled=true
