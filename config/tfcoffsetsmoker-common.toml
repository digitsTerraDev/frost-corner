#OffsetSmoker runtime configuration.
#OffsetSmoker 运行时配置。
[offsetSmoker]
	#EN: When enabled, OffsetSmoker can run without an adjacent TFC stove.
	#ZH: 开启后，OffsetSmoker 可以在没有相邻 TFC 炉灶的情况下运行。
	#EN: Standalone mode always uses its own four local fuel slots and local heat system.
	#ZH: 独立模式下会始终使用自身的四个本地燃料槽和本地热量系统。
	#EN: This setting is intended for world or server startup rather than frequent hot switching during play.
	#ZH: 这个选项更适合在开服或进档前设置，不建议在游玩中频繁热切换。
	enableStandaloneSmoker = false

	#EN: Speed multipliers for timed OffsetSmoker recipe categories.
	#ZH: 用于控制 OffsetSmoker 计时类配方分类的工作速度倍率。
	#EN: Higher numbers are faster. 2.0 means 2x speed, so the effective duration is cut in half.
	#ZH: 数值越大越快。2.0 表示 2 倍速度，等效处理时长会减半。
	[offsetSmoker.speedMultipliers]

		#EN: Speed multipliers for recipes defined by this mod.
		#ZH: 本模组定义的配方分类速度倍率。
		[offsetSmoker.speedMultipliers.tfcoffsetsmoker]
			#EN: Speed multiplier for local smoking recipes generated by tfcoffsetsmoker.
			#ZH: 控制 tfcoffsetsmoker 本地烟熏配方的速度倍率。
			#EN: Local smoking uses real recipe ids, and this value only affects timed local smoking entries.
			#ZH: 本地烟熏使用真实配方 id，这个倍率只影响计时中的本地烟熏条目。
			# Default: 4.0
			# Range: 4.9E-324 ~ 1.7976931348623157E308
			localSmoking = 4.0

		#EN: Speed multipliers for optional Firmalife recipe categories.
		#ZH: 可选兼容模组 Firmalife 配方分类的速度倍率。
		#EN: These values are ignored when Firmalife is not loaded.
		#ZH: 未加载 Firmalife 时，这些设置不会生效。
		[offsetSmoker.speedMultipliers.firmalife]
			#EN: Speed multiplier for Firmalife smoking recipes.
			#ZH: 控制 Firmalife 烟熏配方的速度倍率。
			# Default: 4.0
			# Range: 4.9E-324 ~ 1.7976931348623157E308
			smoking = 4.0
			#EN: Speed multiplier for Firmalife oven recipes.
			#ZH: 控制 Firmalife 烤炉配方的速度倍率。
			# Default: 4.0
			# Range: 4.9E-324 ~ 1.7976931348623157E308
			oven = 4.0

	#EN: Exact recipe duration overrides for OffsetSmoker processing.
	#ZH: 用于覆盖 OffsetSmoker 处理时长的单配方精确设置。
	#EN: Entries use recipe_id=ticks syntax, for example firmalife:oven/wheat_dough=600.
	#ZH: 条目格式为 recipe_id=ticks，例如 firmalife:oven/wheat_dough=600。
	#EN: Local smoking uses real recipe ids such as tfcoffsetsmoker:local_smoking/tfc/food/beef.
	#ZH: 本地烟熏使用真实配方 id，例如 tfcoffsetsmoker:local_smoking/tfc/food/beef。
	#EN: Overrides take priority over speed multipliers.
	#ZH: 单配方覆写优先级高于上面的倍率配置。
	#EN: An overridden TFC heating recipe becomes timed after its temperature gate is met.
	#ZH: 被覆写的 TFC heating 配方在达到所需温度后会转为计时完成。
	[offsetSmoker.recipeDurationOverrides]
		#EN: Exact duration overrides expressed as recipe_id=ticks.
		#ZH: 这里填写单配方绝对时长，格式为 recipe_id=ticks。
		#EN: Leave this list empty to disable per-recipe overrides.
		#ZH: 留空表示不启用单配方时长覆写。
		entries = []
